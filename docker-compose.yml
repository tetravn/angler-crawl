# ─── Angler — Search + Crawl research gateway ─────────────────────────
# Tất cả gom sau 1 gateway Caddy — chỉ MỘT port ra ngoài: 17300
#   http://localhost:17300/searxng/...       → search (json: /searxng/search?q=...&format=json)
#   http://localhost:17300/crawl4ai/...      → crawl/extract
#   http://localhost:17300/flaresolverr/v1   → cloudflare bypass
#   http://localhost:17300/v1/* , /v2/*      → API tương thích Firecrawl (firecrawl-shim)
# 3 service backend là internal-only (không publish port riêng).
#
# ─── Trần tài nguyên ──────────────────────────────────────────────────
# Mọi service đều có CẢ mem_limit LẪN cpus. Angler thường chạy chung máy với
# dịch vụ khác, và crawl4ai + flaresolverr đều chạy trình duyệt thật — một lệnh
# cào rộng hoặc một vòng lặp gọi hỏng là ăn hết CPU rồi kéo theo cả hàng xóm.
#
# Trần CPU cộng lại ~6,25 core. Cố ý ĐỂ DƯ so với số core của máy chủ: đây là
# trần cho từng service, không phải chỗ đặt trước, nên mục tiêu là chặn một
# service đơn lẻ độc chiếm chứ không phải chia hết công suất.
#
# Cách chọn: KHÔNG áp máy móc "2× đỉnh 7 ngày" như với RAM — đỉnh CPU đo được
# lúc tải nhẹ (cao nhất 0,51 core) nên nhân đôi sẽ ra trần bóp chết chính công
# việc crawl. Chọn theo "đủ rộng để làm việc, đủ chặt để không kéo sập hàng
# xóm", và ghi lại số đo bên cạnh từng service để lần sau còn đối chiếu.
#
# Dựng:  docker compose up -d
# Xoá:   docker compose down -v
# Logs:  docker compose logs -f

name: angler

# Docker mặc định KHÔNG xoay log json-file → một service kẹt vòng lặp log sẽ ăn hết đĩa.
# Đã dính thật: file log của crawl4ai lên tới 146 MB + 53 MB vì Redis báo lỗi save mỗi 6s (#16).
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  # ─────────────────────────────────────────────────────────────────
  # SearXNG — Metasearch Engine
  # ─────────────────────────────────────────────────────────────────
  searxng:
    # Ghim bản, không dùng :latest — searxng build lại nhiều lần mỗi ngày nên :latest
    # khiến hai lần deploy cách nhau vài giờ chạy hai bản khác nhau. Tag này là bản
    # :latest trỏ tới lúc ghim (23/09/2026).
    image: docker.io/searxng/searxng:2026.9.23-783a09462
    container_name: searxng
    <<: *logging
    restart: unless-stopped
    # Đỉnh đo được 226 MiB dưới tải search song song. 512m cho biên ~2.3x.
    mem_limit: 512m
    # searxng: đỉnh 7d 0,01 core. Tìm kiếm là I/O-bound, 0,5 đã rộng.
    cpus: "0.5"
    # Internal-only — truy cập qua gateway: http://localhost:17300/searxng/...
    # KHÔNG khai báo expose ở đây: override VPN cho searxng mượn network namespace của
    # gluetun, mà docker từ chối "port exposing + container network mode" cùng lúc — và
    # `expose` không xoá được từ file override (Compose GỘP list, không thay thế). Bỏ đi
    # cũng không mất gì: trong mạng docker do compose tạo, container gọi nhau không cần
    # expose; nó chỉ là metadata. Cổng 8080 được khai ở gluetun khi chạy chế độ VPN.
    env_file: ./searxng/.env
    volumes:
      - ./searxng/core-config/:/etc/searxng/:Z
      - searxng-cache:/var/cache/searxng/
    healthcheck:
      # Image searxng không có curl/wget — chỉ có python3. Dùng /healthz (nhẹ,
      # không chạy search thật trên các engine mỗi chu kỳ).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  # Crawl4AI — AI Web Crawler & Scraper (extract)
  # ─────────────────────────────────────────────────────────────────
  crawl4ai:
    # Pin version, không dùng :latest — 0.9.0 từng đổi default bind sang 127.0.0.1 làm shim
    # không gọi được (#7), nên nâng bản phải chủ động và kiểm lại.
    # 0.9.2 thêm --dir /var/lib/redis cho redis trong supervisord.conf → hết MISCONF (#16).
    image: unclecode/crawl4ai:0.9.3
    container_name: crawl4ai
    <<: *logging
    restart: unless-stopped
    # Internal-only — truy cập qua gateway: http://localhost:17300/crawl4ai/...
    expose:
      - "11235"
    shm_size: "1gb"
    # Không đặt limit thì cgroup v2 báo memory.max = "max", guard memory_threshold_percent
    # của crawl4ai parse hỏng rồi âm thầm đo RAM TOÀN HOST → không bảo vệ được gì, và một
    # crawl chạy loạn kéo sập cả máy (#15, upstream unclecode/crawl4ai#2123). Có limit thì
    # guard chặn ở ~2.85 GB, và nếu vẫn tràn thì OOM chỉ giết crawl4ai chứ không phải host.
    # Quan sát: bình thường ~766 MiB, đỉnh mỗi request ~1.5 GB.
    mem_limit: 3g
    # crawl4ai: chạy trình duyệt thật, là chỗ ngốn CPU nhất khi cào nhiều
    # trang song song. Đỉnh 7d chỉ 0,12 core nhưng tuần qua dùng nhẹ — cố ý nới
    # rộng để không bóp chết công việc crawl thật.
    cpus: "2.0"
    environment:
      # 0.9.0 CHỈ bind mọi interface khi có token (không thì entrypoint ép loopback 127.0.0.1
      # → container khác gọi không được, mọi scrape fail). Token nội bộ (crawl4ai không publish
      # ra host/Internet), override qua CRAWL4AI_TOKEN. Shim gửi khớp token này (#7).
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN:-angler-internal-c4}
      - GUNICORN_BIND=0.0.0.0:11235
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11235/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  # FlareSolverr — Cloudflare / Anti-bot bypass proxy
  # ─────────────────────────────────────────────────────────────────
  flaresolverr:
    # Ghim bản, không dùng :latest — v3.5.2 là release mới nhất (12/09/2026).
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    <<: *logging
    restart: unless-stopped
    # Biên độ lớn nhất stack: 88 MiB lúc rảnh nhưng 689 MiB khi giải một challenge
    # Cloudflare — nó spawn Chromium thật. Đặt trần theo mức rảnh là giết nhầm nó giữa
    # lúc đang giải. 1500m cho biên ~2.2x trên đỉnh đo được, và còn chỗ cho vài phiên
    # song song. shm_size 512m ở dưới cũng tính vào cgroup này.
    mem_limit: 1500m
    # flaresolverr: cũng chạy trình duyệt; đỉnh 7d cao nhất trong 6 service (0,51).
    cpus: "1.5"
    # Internal-only — truy cập qua gateway: http://localhost:17300/flaresolverr/v1
    expose:
      - "8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/v1", "-H", "Content-Type: application/json", "-d", '{"cmd":"sessions.list"}']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    shm_size: "512mb"

  # ─────────────────────────────────────────────────────────────────
  # Firecrawl-shim — API tương thích Firecrawl, ruột là Crawl4AI + FlareSolverr
  # Cho agent chỉ-biết-Firecrawl dùng được mà không sửa code.
  # ─────────────────────────────────────────────────────────────────
  firecrawl-shim:
    build: ./firecrawl-shim
    # BẮT BUỘC build lại mỗi lần `up` (SDO-210). Thiếu dòng này thì `up -d` thấy image
    # `angler-fw1uce-firecrawl-shim:latest` đã có sẵn là dùng lại, KHÔNG build: Dokploy
    # auto-deploy kéo mã mới, recreate container, báo xanh — mà code trong container vẫn là
    # bản cũ (đo 05/09: image 4 tuần tuổi, bản vá SSRF không có trong container). Đặt ở
    # compose chứ không ở lệnh deploy của Dokploy để repo là nguồn sự thật. Kiểm sau deploy:
    # GET /health → "code" phải khớp fingerprint của firecrawl-shim/app ở commit vừa merge.
    pull_policy: build
    container_name: firecrawl-shim
    <<: *logging
    restart: unless-stopped
    # Bản thân app rất nhẹ (~45 MiB), nhưng JOBS giữ kết quả crawl/batch trong RAM tới
    # khi hết JOB_TTL_SECONDS (24h). Đo được: một batch 18 URL kèm rawHtml đẩy peak từ
    # 73 lên 146 MiB, tức ~4 MiB mỗi kết quả nằm lại. Đây là đường tăng tuyến tính theo
    # số trang đã cào, không phải theo tải tức thời. 1g đủ cho ~200 trang lưu; vượt nữa
    # thì vấn đề là job store chứ không phải trần này.
    mem_limit: 1g
    # firecrawl-shim: điều phối, deep-research nhiều vòng có thể bận.
    cpus: "1.0"
    # Internal-only — truy cập qua gateway: http://localhost:17300/firecrawl/v1/...
    expose:
      - "8000"
    environment:
      - CRAWL4AI_URL=http://crawl4ai:11235
      # Phải KHỚP CRAWL4AI_API_TOKEN của service crawl4ai (#7).
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_TOKEN:-angler-internal-c4}
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - SEARXNG_URL=http://searxng:8080
      - JOBS_DB_PATH=/data/jobs.db
      # Bảo vệ IP / tiết kiệm (đều có default hợp lý, chỉ chỉnh khi cần):
      #   CRAWL4AI_CACHE_MODE=ENABLED   # dùng cache Crawl4AI (BYPASS = luôn tải mới)
      #   SCRAPE_CACHE_TTL=600          # cache RAM kết quả scrape (giây); 0 = tắt
      #   SCRAPE_CACHE_MAX=128          # số entry tối đa của cache
      #   PER_DOMAIN_DELAY_MS=500       # giãn nhịp giữa 2 request cùng domain (ms); 0 = tắt
      #   FS_DOMAIN_TTL=1800            # nhớ "domain cần FlareSolverr" (giây); 0 = tắt
      # Cấu hình LLM: gọi THẲNG một endpoint OpenAI-compatible, không qua router.
      # Bỏ trống LLM_BASE_URL = /v1/extract và deep-research báo lỗi cấu hình.
      # Hai bậc model: FAST cho việc cơ học (dịch query, đoán intent, lập kế hoạch),
      # SMART cho payload lớn + suy luận khó (extract, so chéo nguồn, tổng hợp).
      # Trỏ cả hai vào cùng một model cũng được.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_FAST=${LLM_MODEL_FAST:-}
      - LLM_MODEL_SMART=${LLM_MODEL_SMART:-}
      # Dùng khi gọi không nêu bậc nào; để trống thì rơi về chuỗi rỗng và báo lỗi cấu hình.
      - LLM_MODEL=${LLM_MODEL:-}
      # =1 (mặc định): gửi response_format json_object. =0 cho model "thinking" (Qwen3 reasoning)
      # vì format:json làm content rỗng — đặt LLM_JSON_NATIVE=0 trong .env khi dùng model như vậy.
      - LLM_JSON_NATIVE=${LLM_JSON_NATIVE:-1}
      # Ghi log hoạt động vào SQLite + stdout. LOG_DB_LEVEL=DEBUG để lưu cả chi tiết.
      - LOG_DB_ENABLED=${LOG_DB_ENABLED:-1}
      - LOG_DB_LEVEL=${LOG_DB_LEVEL:-INFO}
      - LOG_TTL_SECONDS=${LOG_TTL_SECONDS:-604800}
      # Rate limit theo IP (request/phút). 0 = tắt. Bật khi host public.
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-0}
    volumes:
      # Lưu job crawl (SQLite) để sống sót qua restart.
      - firecrawl-jobs:/data
    depends_on:
      - crawl4ai
      - flaresolverr
      - searxng

  # ─────────────────────────────────────────────────────────────────
  # Gateway — Caddy reverse proxy, gom các service về 1 port (17300)
  # ─────────────────────────────────────────────────────────────────
  gateway:
    # Ghim bản, không dùng nhánh :2-alpine — bản vá mới của Caddy 2 tự vào theo tag đó.
    image: docker.io/caddy:2.11.4-alpine
    container_name: gateway
    <<: *logging
    restart: unless-stopped
    # Đỉnh đo được 16 MiB — Caddy chỉ proxy, không buffer nội dung. 128m là dư dả.
    mem_limit: 128m
    # gateway: chỉ proxy, đỉnh 7d 0,00.
    cpus: "0.25"
    ports:
      # Mặc định CHỈ nghe trên loopback. Stack không có auth khi ANGLER_API_KEY trống,
      # và /v1/extract tiêu key LLM thật, nên bind 0.0.0.0 phải là lựa chọn chủ động
      # chứ không phải mặc định. Mở cho máy khác trong mạng LAN: đặt ANGLER_BIND=0.0.0.0
      # trong .env. Mở ra internet: dùng docker-compose.public.yml.
      - "${ANGLER_BIND:-127.0.0.1}:${ANGLER_PORT:-17300}:80"
    environment:
      # Cổng API key: đặt ANGLER_API_KEY trong .env để bật, để trống thì mở (local).
      - ANGLER_API_KEY=${ANGLER_API_KEY:-}
      # Tên miền khi host public. Default phải do compose cấp chứ không phải do
      # cú pháp {$VAR:default} của Caddy: Caddy chỉ dùng default khi biến KHÔNG
      # ĐƯỢC ĐẶT, còn compose luôn đặt nó (rỗng). Biến rỗng làm dòng mở site block
      # thành "{" và Caddy đọc nhầm thành global options block rồi chết.
      - ANGLER_SITE_ADDRESS=${ANGLER_SITE_ADDRESS:-:80}
      - ANGLER_MAX_BODY=${ANGLER_MAX_BODY:-10MB}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:Z
      # Trang tĩnh discovery: landing HTML, llms.txt, manifest.json (read-only).
      - ./gateway/site:/srv:ro,Z
      # Chứng chỉ TLS. Không có volume này thì mỗi lần recreate container là xin lại
      # chứng chỉ mới, và Let's Encrypt chặn sau 5 lần cùng một tên miền trong 1 tuần.
      - caddy-data:/data
    depends_on:
      - searxng
      - crawl4ai
      - flaresolverr
      - firecrawl-shim
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  searxng-cache:
  firecrawl-jobs:
  caddy-data: