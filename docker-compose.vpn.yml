# ─── Override BẬT VPN egress + xoay IP (opt-in) ──────────────────────────
# Dùng:  docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d
# Tắt VPN: chạy lại CHỈ với docker-compose.yml (docker compose up -d).
# Cần điền .env (xem .env.example): NORDVPN_USER, NORDVPN_PASS, VPN_COUNTRIES.
#
# ── Vì sao OpenVPN/TCP chứ không phải WireGuard ──
# Đo trên chính máy đang chạy stack (06/08/2026): WireGuard bắt tay xong nhưng KHÔNG
# truyền dữ liệu — `PMTUD failed with both ICMP and TCP`, mọi lookup trong tunnel
# `i/o timeout`, phải restart 24–31 lần vẫn `unhealthy`; ép WIREGUARD_MTU=1280 không
# cứu. Máy này mất 13–17% gói và bị nhà cung cấp chặn UDP/123, trong khi TCP đo được
# 5/5. WireGuard CHỈ chạy UDP ⇒ sai công cụ. OpenVPN/TCP nối xong trong ~10 giây.
#
# Cũng đã loại: HTTP proxy (proxy_ssl cổng 89) và SOCKS5 của NordVPN. Endpoint còn
# sống và bắt tay TLS được, nhưng TỪ CHỐI cả service credentials hợp lệ (407 +
# `Proxy-Authenticate: Basic realm="NordVPN"`) — cùng credential đó OpenVPN nhận
# ngay. Tức dịch vụ proxy đã ngưng trên thực tế dù tài liệu vẫn còn hướng dẫn.
#
# Hai đường ra khác nhau, cố ý:
#
#   1. searxng — TOÀN BỘ traffic qua VPN (network_mode: service:gluetun).
#      Engine tìm kiếm là thứ bị chặn theo IP (CAPTCHA / access denied /
#      too many requests), nên nó cần đổi IP chứ không phải cấu hình proxy có
#      thể bị bỏ sót. Chạy chung namespace nghĩa là searxng KHÔNG CÓ đường ra
#      nào khác ngoài tunnel — FIREWALL=on của gluetun thành kill-switch thật.
#
#   2. firecrawl-shim — VPN theo TỪNG REQUEST qua HTTP proxy (VPN_PROXY_URL),
#      chọn bằng field "egress": "vpn". Scrape phần lớn không cần VPN và đi
#      thẳng thì nhanh hơn; xem firecrawl-shim/app/egress.py (không cấu hình
#      hoặc không reachable → fail-open về direct).
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      # OpenVPN qua TCP, KHÔNG dùng WireGuard — xem ghi chú "Vì sao TCP" ở đầu file.
      - VPN_TYPE=openvpn
      - OPENVPN_PROTOCOL=tcp
      # Service credentials (Nord Account > NordVPN > Manual setup), KHÁC email/mật khẩu
      # tài khoản: bản thân NordVPN không cho app bên thứ ba dùng credential tài khoản.
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASS}
      # Mặc định exit ở gần: SearXNG có request_timeout 3s, đi vòng qua châu Âu là
      # bing/mojeek chuyển thẳng từ "có kết quả" sang timeout (đã đo). ~900 server
      # trong nhóm này nên vẫn thừa đa dạng để xoay IP.
      - SERVER_COUNTRIES=${VPN_COUNTRIES:-Singapore,Hong Kong,Japan}
      - HTTPPROXY=on            # HTTP proxy nội bộ cổng 8888, tunnel qua VPN
      - FIREWALL=on             # kill-switch: VPN rớt → chặn (không rò IP thật)
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
    volumes:
      # Mở đúng 3 route cho vpn-rotator; mọi route khác vẫn private. Xem file.
      - ./gluetun/auth-config.toml:/gluetun/auth/config.toml:ro
    expose:
      - "8888"     # HTTP proxy (shim dùng khi egress=vpn)
      - "8000"     # control server (chỉ trong mạng docker, KHÔNG publish ra host)
      - "8080"     # cổng của searxng, vì searxng chạy trong namespace này
    restart: unless-stopped

  # searxng mượn network namespace của gluetun ⇒ mọi request engine đi qua VPN.
  # Hệ quả: searxng không còn tên riêng trong mạng docker, phải gọi qua gluetun:8080
  # (xem SEARXNG_URL của shim và SEARXNG_UPSTREAM của gateway bên dưới).
  searxng:
    network_mode: "service:gluetun"
    # Lưu ý: docker từ chối "conflicting options: port exposing and the container type
    # network mode" nếu service vừa expose cổng vừa mượn namespace container khác. Vì
    # Compose GỘP list `expose` (override không xoá được), `expose` đã được bỏ khỏi
    # docker-compose.yml; cổng 8080 khai ở gluetun bên trên.
    depends_on:
      - gluetun

  gateway:
    environment:
      - SEARXNG_UPSTREAM=gluetun:8080

  firecrawl-shim:
    environment:
      - VPN_PROXY_URL=http://gluetun:8888
      - SEARXNG_URL=http://gluetun:8080
      # Ở chế độ VPN thì scrape cũng đi VPN theo mặc định (không chỉ search), vì
      # nguồn chặn theo IP không phân biệt request đến từ đường nào. Vẫn ghi đè
      # được theo từng request bằng field "egress": "direct".
      # Lưu ý: resolve_proxy() fail-open — lúc gluetun đang xoay IP mà proxy chưa
      # sẵn sàng thì request rơi về direct (lộ IP host) chứ không fail. Đánh đổi
      # nghiêng về "chạy được" thay vì "tuyệt đối ẩn"; đổi ở app/egress.py nếu cần ngược lại.
      - DEFAULT_EGRESS=vpn
    depends_on:
      - gluetun

  # ─────────────────────────────────────────────────────────────────
  # Xoay IP định kỳ — chống bị chặn vì "too many requests" từ một IP
  # ─────────────────────────────────────────────────────────────────
  # gluetun không tự xoay IP: nó nối MỘT server rồi giữ nguyên. Ép đổi bằng cách
  # gọi control server stop→start; mỗi lần nối lại nó bốc một server khác trong
  # nhóm SERVER_COUNTRIES. Đây là cách duy nhất được hỗ trợ chính thức.
  #
  # Lưu ý: lúc xoay, searxng mất mạng vài giây (nó dùng chung namespace). Đó là
  # đánh đổi có chủ đích — thà ngắt vài giây còn hơn để một IP ăn đủ rate-limit.
  vpn-rotator:
    image: curlimages/curl:latest
    container_name: vpn-rotator
    restart: unless-stopped
    depends_on:
      - gluetun
    environment:
      - ROTATE_MINUTES=${VPN_ROTATE_MINUTES:-15}
      - GLUETUN_URL=http://gluetun:8000
    volumes:
      - ./gluetun/rotate-ip.sh:/rotate-ip.sh:ro
    entrypoint: ["/bin/sh", "/rotate-ip.sh"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
