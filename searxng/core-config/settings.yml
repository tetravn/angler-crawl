# SearXNG cấu hình — bật JSON API + 80+ search engines
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

search:
  formats:
    - html
    - json

# #5: siết timeout engine để /search không chờ engine chậm/treo. request_timeout là hạn
# mặc định mỗi engine; max_request_timeout là TRẦN CỨNG — không engine nào vượt → tổng
# thời gian searxng bị chặn ~5s thay vì chờ engine chậm nhất tới ~15s.
outgoing:
  request_timeout: 3.0
  max_request_timeout: 5.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

server:
  secret_key: "angler-local-dev-key-change-in-prod"
  bind_address: "0.0.0.0"
  # Cho phép CORS từ localhost để Hermes gọi API
  limiter: false

# Bật các engines phổ biến
engines:
